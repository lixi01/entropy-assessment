<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>熵减践行工具包 - 多维熵值评估量表</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #4a5568 0%, #2d3748 100%);
            color: white;
            padding: 40px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
            font-size: 14px;
            line-height: 1.6;
        }

        .progress-bar {
            background: #e2e8f0;
            height: 8px;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .progress-fill {
            background: linear-gradient(90deg, #667eea, #764ba2);
            height: 100%;
            width: 0%;
            transition: width 0.3s ease;
        }

        .content {
            padding: 30px;
        }

        .intro {
            background: #f7fafc;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
            border-left: 4px solid #667eea;
        }

        .intro h3 {
            color: #4a5568;
            margin-bottom: 10px;
        }

        .intro p {
            color: #718096;
            font-size: 14px;
            line-height: 1.8;
        }

        .question-card {
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
            transition: all 0.3s ease;
        }

        .question-card:hover {
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            transform: translateY(-2px);
        }

        .question-card.answered {
            border-color: #48bb78;
            background: #f0fff4;
        }

        .question-number {
            display: inline-block;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            width: 32px;
            height: 32px;
            line-height: 32px;
            text-align: center;
            border-radius: 50%;
            font-weight: bold;
            font-size: 14px;
            margin-right: 15px;
        }

        .question-text {
            display: inline;
            font-size: 16px;
            color: #2d3748;
            line-height: 1.6;
        }

        .options {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            gap: 10px;
            flex-wrap: wrap;
        }

        .option {
            flex: 1;
            min-width: 100px;
        }

        .option input {
            display: none;
        }

        .option label {
            display: block;
            padding: 12px 8px;
            text-align: center;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 13px;
            color: #4a5568;
        }

        .option label:hover {
            border-color: #667eea;
            background: #f7fafc;
        }

        .option input:checked + label {
            border-color: #667eea;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .submit-section {
            text-align: center;
            padding: 30px;
            background: #f7fafc;
            border-radius: 12px;
            margin-top: 30px;
        }

        .submit-btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 18px 60px;
            font-size: 18px;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.5);
        }

        .submit-btn:disabled {
            background: #cbd5e0;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        .unanswered-hint {
            color: #e53e3e;
            margin-top: 15px;
            font-size: 14px;
        }

        /* Results Section */
        .results {
            display: none;
            padding: 30px;
        }

        .result-card {
            background: #f7fafc;
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 25px;
        }

        .result-card h3 {
            color: #2d3748;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .result-card h3 .icon {
            font-size: 24px;
        }

        .score-display {
            font-size: 48px;
            font-weight: bold;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .score-label {
            color: #718096;
            font-size: 14px;
            margin-top: 5px;
        }

        .entropy-level {
            display: inline-block;
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: bold;
            margin-top: 15px;
        }

        .entropy-low {
            background: #c6f6d5;
            color: #276749;
        }

        .entropy-mid {
            background: #fefcbf;
            color: #975a16;
        }

        .entropy-high {
            background: #fed7d7;
            color: #c53030;
        }

        .dimension-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid #e2e8f0;
        }

        .dimension-row:last-child {
            border-bottom: none;
        }

        .dimension-name {
            font-weight: 600;
            color: #2d3748;
        }

        .dimension-score {
            font-size: 20px;
            font-weight: bold;
            color: #667eea;
        }

        .dimension-type {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }

        .type-positive {
            background: #c6f6d5;
            color: #276749;
        }

        .type-negative {
            background: #fed7d7;
            color: #c53030;
        }

        /* Radar Chart */
        .chart-container {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        #radarChart {
            max-width: 400px;
        }

        /* Entropy Type */
        .entropy-type-card {
            text-align: center;
            padding: 40px;
        }

        .type-icon {
            font-size: 80px;
            margin-bottom: 20px;
        }

        .type-name {
            font-size: 32px;
            font-weight: bold;
            color: #2d3748;
            margin-bottom: 10px;
        }

        .type-description {
            color: #718096;
            line-height: 1.8;
            max-width: 500px;
            margin: 0 auto;
        }

        .type-traits {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
        }

        .trait-tag {
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            background: #edf2f7;
            color: #4a5568;
        }

        /* Restart Button */
        .restart-btn {
            background: #edf2f7;
            color: #4a5568;
            border: none;
            padding: 15px 40px;
            font-size: 16px;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 30px;
        }

        .restart-btn:hover {
            background: #e2e8f0;
        }

        /* Sub-dimension bars */
        .sub-dimension {
            margin-bottom: 20px;
        }

        .sub-dimension-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .sub-dimension-name {
            font-weight: 600;
            color: #4a5568;
        }

        .sub-dimension-score {
            font-weight: bold;
            color: #667eea;
        }

        .sub-dimension-bar {
            height: 12px;
            background: #e2e8f0;
            border-radius: 6px;
            overflow: hidden;
        }

        .sub-dimension-fill {
            height: 100%;
            background: linear-gradient(90deg, #48bb78, #38a169);
            border-radius: 6px;
            transition: width 0.5s ease;
        }

        .sub-dimension-fill.warning {
            background: linear-gradient(90deg, #ed8936, #dd6b20);
        }

        .sub-dimension-fill.danger {
            background: linear-gradient(90deg, #fc8181, #e53e3e);
        }

        .sub-dimension-desc {
            font-size: 12px;
            color: #718096;
            margin-top: 5px;
        }

        @media (max-width: 600px) {
            .options {
                flex-direction: column;
            }
            
            .option {
                min-width: 100%;
            }

            .header h1 {
                font-size: 22px;
            }

            .content {
                padding: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🧠 熵减践行工具包</h1>
            <p>多维熵值/熵型评估量表</p>
        </div>
        
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>

        <div class="content" id="questionnaire">
            <div class="intro">
                <h3>📋 测评说明</h3>
                <p>这份评估量表包含了32条关于你的客观描述，请在仔细阅读每一条描述后，选择一个和你实际情况最相符的选项。<br><br>
                <strong>特别提醒：</strong>答案没有对错之分，请用内心最真实的声音作答。如果遇到难以确定的问题，不要停下来思考太久，请按第一感觉做出选择。</p>
            </div>

            <div id="questions"></div>

            <div class="submit-section">
                <button class="submit-btn" id="submitBtn" onclick="calculateResults()">查看测评结果</button>
                <p class="unanswered-hint" id="unansweredHint"></p>
            </div>
        </div>

        <div class="results" id="results">
            <!-- Results will be inserted here -->
        </div>
    </div>

    <script>
        // 32道题目
        const questions = [
            "我感到每天都在朝自己的目标迈进",
            "有麻烦的时候，我通常能想到一些应付的方法",
            "一些技能（比如跑步、演讲、写作），即使我再努力，也不会学得多好",
            "我认为逆境有时候是对成长的一种帮助",
            "当一个有难度的工作需要人做时，我不希望那人是我",
            "我不喜欢所有新鲜且经常变化的事",
            "无论是什么事情，一旦开始了我就会坚持下去直至完成",
            "我觉得与结果相比，做一件事的过程更能够帮助人成长",
            "当得知一个坏消息时，我的情绪通常会比其他人更激烈",
            "我经常试图摆脱脑海中一些不必要的想法",
            "我总是需要克制自己想要一直休闲、娱乐、放松的欲望",
            "失败总是让我在相当长一段时间内感到气馁",
            "我在工作或学习时，脑子里常会想到其他不相干的事情",
            "我常常能在自己所做的事情中找到乐趣",
            "当被迫在压力下工作时，我感到心烦意乱又极不情愿",
            "当碰到一个没有把握解决的难题时，我会非常兴奋、快乐",
            "我知道自己现在是为了什么而努力",
            "我相信自己能有效应对任何生活中突发的意外",
            "不管我所做的事成绩好坏，我都从不怀疑自己的学习能力",
            "经历挫折后我一般会变得更加成熟和有经验",
            "我不喜欢做那些我不知道能否顺利完成的事",
            "我不喜欢在不熟悉的环境中做事",
            "我喜欢那种需要全力以赴才能完成的工作",
            "不管一件事的结果如何，我相信自己在过程中付出的努力是不会白费的",
            "每次有情绪波动的时候，我都能第一时间觉察",
            "我常常试着不去想、也不和人讨论让我烦恼的事情",
            "我经常得抵抗美食的诱惑",
            "我一般要过很久才能忘记不愉快的事情",
            "我在工作或学习时，对周围的动静比如有人说话和倒水听得很清楚",
            "只要是能获得满足感的工作，哪怕没有报酬我也愿意做",
            "面对压力时，我会思考自己做了什么事情要承受这些",
            "面对的事越困难，我越能集中自己的全部精力去面对"
        ];

        // 计分规则：reverse表示5-4-3-2-1，normal表示1-2-3-4-5
        const scoringRules = {
            1: 'reverse', 2: 'reverse', 3: 'normal', 4: 'reverse',
            5: 'normal', 6: 'normal', 7: 'reverse', 8: 'reverse',
            9: 'normal', 10: 'normal', 11: 'normal', 12: 'normal',
            13: 'reverse', 14: 'reverse', 15: 'normal', 16: 'reverse',
            17: 'reverse', 18: 'reverse', 19: 'normal', 20: 'reverse',
            21: 'normal', 22: 'normal', 23: 'reverse', 24: 'reverse',
            25: 'normal', 26: 'normal', 27: 'normal', 28: 'normal',
            29: 'normal', 30: 'reverse', 31: 'normal', 32: 'reverse'
        };

        const optionLabels = ['完全不符', '不太符合', '一般', '比较符合', '完全符合'];

        // 生成问题HTML
        function generateQuestions() {
            const container = document.getElementById('questions');
            let html = '';

            questions.forEach((q, index) => {
                const qNum = index + 1;
                html += `
                    <div class="question-card" id="card-${qNum}">
                        <span class="question-number">${qNum}</span>
                        <span class="question-text">${q}</span>
                        <div class="options">
                            ${optionLabels.map((label, i) => `
                                <div class="option">
                                    <input type="radio" name="q${qNum}" id="q${qNum}_${i+1}" value="${i+1}" onchange="updateProgress()">
                                    <label for="q${qNum}_${i+1}">${label}</label>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        // 更新进度条
        function updateProgress() {
            const answered = document.querySelectorAll('input[type="radio"]:checked').length;
            const progress = (answered / 32) * 100;
            document.getElementById('progressFill').style.width = progress + '%';

            // 更新已回答的卡片样式
            for (let i = 1; i <= 32; i++) {
                const card = document.getElementById(`card-${i}`);
                const isAnswered = document.querySelector(`input[name="q${i}"]:checked`);
                if (isAnswered) {
                    card.classList.add('answered');
                } else {
                    card.classList.remove('answered');
                }
            }

            // 更新提交按钮状态
            const submitBtn = document.getElementById('submitBtn');
            if (answered === 32) {
                submitBtn.disabled = false;
                document.getElementById('unansweredHint').textContent = '';
            }
        }

        // 获取题目分数
        function getScore(qNum) {
            const selected = document.querySelector(`input[name="q${qNum}"]:checked`);
            if (!selected) return null;
            
            const rawValue = parseInt(selected.value); // 1-5
            if (scoringRules[qNum] === 'reverse') {
                return 6 - rawValue; // 5,4,3,2,1
            } else {
                return rawValue; // 1,2,3,4,5
            }
        }

        // 计算结果
        function calculateResults() {
            // 检查是否全部回答
            const unanswered = [];
            for (let i = 1; i <= 32; i++) {
                if (!document.querySelector(`input[name="q${i}"]:checked`)) {
                    unanswered.push(i);
                }
            }

            if (unanswered.length > 0) {
                document.getElementById('unansweredHint').textContent = 
                    `还有 ${unanswered.length} 道题未回答：第 ${unanswered.slice(0, 5).join('、')}${unanswered.length > 5 ? '...' : ''} 题`;
                
                // 滚动到第一个未回答的题目
                document.getElementById(`card-${unanswered[0]}`).scrollIntoView({ behavior: 'smooth', block: 'center' });
                return;
            }

            // 计算总熵值
            let totalScore = 0;
            for (let i = 1; i <= 32; i++) {
                totalScore += getScore(i);
            }

            // 计算封闭程度（1-8, 17-24）
            let closednessScore = 0;
            [1,2,3,4,5,6,7,8,17,18,19,20,21,22,23,24].forEach(q => {
                closednessScore += getScore(q);
            });

            // 计算做功阻力（9-16, 25-32）
            let resistanceScore = 0;
            [9,10,11,12,13,14,15,16,25,26,27,28,29,30,31,32].forEach(q => {
                resistanceScore += getScore(q);
            });

            // 五向熵维
            // 封闭性（1-4, 17-20）
            let closednessSubScore = 0;
            [1,2,3,4,17,18,19,20].forEach(q => closednessSubScore += getScore(q));
            closednessSubScore /= 8;

            // 平衡态（5-6, 21-22）
            let equilibriumScore = 0;
            [5,6,21,22].forEach(q => equilibriumScore += getScore(q));
            equilibriumScore /= 4;

            // 高线性（7-8, 23-24）
            let linearityScore = 0;
            [7,8,23,24].forEach(q => linearityScore += getScore(q));
            linearityScore /= 4;

            // 内心失序（9-12, 25-28）
            let disorderScore = 0;
            [9,10,11,12,25,26,27,28].forEach(q => disorderScore += getScore(q));
            disorderScore /= 8;

            // 能量失焦（13-16, 29-32）
            let defocusScore = 0;
            [13,14,15,16,29,30,31,32].forEach(q => defocusScore += getScore(q));
            defocusScore /= 8;

            // 判断熵值等级
            let entropyLevel, entropyClass;
            if (totalScore <= 64) {
                entropyLevel = '低熵';
                entropyClass = 'entropy-low';
            } else if (totalScore <= 127) {
                entropyLevel = '中熵';
                entropyClass = 'entropy-mid';
            } else {
                entropyLevel = '高熵';
                entropyClass = 'entropy-high';
            }

            // 判断思维类型
            const isGrowthMindset = closednessScore < 40;
            const isEfficient = resistanceScore < 40;

            // 判断熵型
            let entropyType, typeIcon, typeDesc, typeTraits;
            if (isGrowthMindset && isEfficient) {
                entropyType = '海豚型';
                typeIcon = '🐬';
                typeDesc = '高开放、低内阻，能不断扩大伸展圈。目标清晰，认知能量集中，享受过程，内心充满弹性。';
                typeTraits = ['高开放', '低内阻', '目标清晰', '享受过程', '内心弹性强'];
            } else if (isGrowthMindset && !isEfficient) {
                entropyType = '树懒型';
                typeIcon = '🦥';
                typeDesc = '高开放、高内阻，想跨入伸展圈，但行动力差。目标清晰，但认知能量涣散，注重过程，但内心缺乏弹性。';
                typeTraits = ['高开放', '高内阻', '行动力弱', '能量涣散', '缺乏弹性'];
            } else if (!isGrowthMindset && isEfficient) {
                entropyType = '犀牛型';
                typeIcon = '🦏';
                typeDesc = '低开放、低内阻，满足于在舒适圈内"勤奋"。认知能量旺盛，但没有目标，内心弹性强，但只看重结果。';
                typeTraits = ['低开放', '低内阻', '舒适圈勤奋', '缺乏目标', '只重结果'];
            } else {
                entropyType = '海鞘型';
                typeIcon = '🫎';
                typeDesc = '低开放、高内阻，沉溺于舒适圈，拒绝变化和挑战。目标混乱或缺失，认知能量枯竭，充满消极认知，内心非常脆弱。';
                typeTraits = ['低开放', '高内阻', '拒绝挑战', '目标缺失', '内心脆弱'];
            }

            // 计算五维平均分
            const avgSubScore = (closednessSubScore + equilibriumScore + linearityScore + disorderScore + defocusScore) / 5;

            // 显示结果
            displayResults({
                totalScore,
                entropyLevel,
                entropyClass,
                closednessScore,
                resistanceScore,
                isGrowthMindset,
                isEfficient,
                closednessSubScore,
                equilibriumScore,
                linearityScore,
                disorderScore,
                defocusScore,
                avgSubScore,
                entropyType,
                typeIcon,
                typeDesc,
                typeTraits
            });
        }

        // 显示结果
        function displayResults(data) {
            document.getElementById('questionnaire').style.display = 'none';
            const resultsDiv = document.getElementById('results');
            resultsDiv.style.display = 'block';

            // 判断每个维度是否需要警示
            const getBarClass = (score, avg) => {
                const diff = Math.abs(score - avg) / avg;
                if (diff > 0.25) return 'danger';
                if (diff > 0.15) return 'warning';
                return '';
            };

            resultsDiv.innerHTML = `
                <div class="result-card">
                    <h3><span class="icon">📊</span> 总熵值</h3>
                    <div class="score-display">${data.totalScore}</div>
                    <div class="score-label">满分160分，分数越高熵值越高</div>
                    <div class="entropy-level ${data.entropyClass}">${data.entropyLevel}状态</div>
                    <div style="margin-top: 15px; color: #718096; font-size: 14px;">
                        32～64分：低熵 | 65～127分：中熵 | 128～160分：高熵
                    </div>
                </div>

                <div class="result-card">
                    <h3><span class="icon">🎯</span> 两大主维度</h3>
                    <div class="dimension-row">
                        <span class="dimension-name">封闭程度</span>
                        <span class="dimension-score">${data.closednessScore}分</span>
                        <span class="dimension-type ${data.isGrowthMindset ? 'type-positive' : 'type-negative'}">
                            ${data.isGrowthMindset ? '成长型思维' : '固化型思维'}
                        </span>
                    </div>
                    <div class="dimension-row">
                        <span class="dimension-name">做功阻力</span>
                        <span class="dimension-score">${data.resistanceScore}分</span>
                        <span class="dimension-type ${data.isEfficient ? 'type-positive' : 'type-negative'}">
                            ${data.isEfficient ? '增效型做功' : '内耗型做功'}
                        </span>
                    </div>
                    <div style="margin-top: 15px; color: #718096; font-size: 14px;">
                        小于40分为积极倾向，大于40分为消极倾向
                    </div>
                </div>

                <div class="result-card">
                    <h3><span class="icon">⭐</span> 五向熵维</h3>
                    <div style="margin-bottom: 10px; color: #718096; font-size: 14px;">
                        平均分：${data.avgSubScore.toFixed(2)} | 与平均分差异超过25%需重点关注
                    </div>
                    
                    <div class="sub-dimension">
                        <div class="sub-dimension-header">
                            <span class="sub-dimension-name">封闭性</span>
                            <span class="sub-dimension-score">${data.closednessSubScore.toFixed(2)}</span>
                        </div>
                        <div class="sub-dimension-bar">
                            <div class="sub-dimension-fill ${getBarClass(data.closednessSubScore, data.avgSubScore)}" 
                                 style="width: ${data.closednessSubScore * 20}%"></div>
                        </div>
                        <div class="sub-dimension-desc">涉及：目标感、自我效能感、学习信念、积极认知</div>
                    </div>

                    <div class="sub-dimension">
                        <div class="sub-dimension-header">
                            <span class="sub-dimension-name">平衡态</span>
                            <span class="sub-dimension-score">${data.equilibriumScore.toFixed(2)}</span>
                        </div>
                        <div class="sub-dimension-bar">
                            <div class="sub-dimension-fill ${getBarClass(data.equilibriumScore, data.avgSubScore)}" 
                                 style="width: ${data.equilibriumScore * 20}%"></div>
                        </div>
                        <div class="sub-dimension-desc">涉及：回避挑战、拒绝改变</div>
                    </div>

                    <div class="sub-dimension">
                        <div class="sub-dimension-header">
                            <span class="sub-dimension-name">高线性</span>
                            <span class="sub-dimension-score">${data.linearityScore.toFixed(2)}</span>
                        </div>
                        <div class="sub-dimension-bar">
                            <div class="sub-dimension-fill ${getBarClass(data.linearityScore, data.avgSubScore)}" 
                                 style="width: ${data.linearityScore * 20}%"></div>
                        </div>
                        <div class="sub-dimension-desc">涉及：坚毅特质、过程导向</div>
                    </div>

                    <div class="sub-dimension">
                        <div class="sub-dimension-header">
                            <span class="sub-dimension-name">内心失序</span>
                            <span class="sub-dimension-score">${data.disorderScore.toFixed(2)}</span>
                        </div>
                        <div class="sub-dimension-bar">
                            <div class="sub-dimension-fill ${getBarClass(data.disorderScore, data.avgSubScore)}" 
                                 style="width: ${data.disorderScore * 20}%"></div>
                        </div>
                        <div class="sub-dimension-desc">涉及：情绪敏感、控制想法、抑制欲望、反脆弱</div>
                    </div>

                    <div class="sub-dimension">
                        <div class="sub-dimension-header">
                            <span class="sub-dimension-name">能量失焦</span>
                            <span class="sub-dimension-score">${data.defocusScore.toFixed(2)}</span>
                        </div>
                        <div class="sub-dimension-bar">
                            <div class="sub-dimension-fill ${getBarClass(data.defocusScore, data.avgSubScore)}" 
                                 style="width: ${data.defocusScore * 20}%"></div>
                        </div>
                        <div class="sub-dimension-desc">涉及：专注力、自成目标、抗压力、逆商</div>
                    </div>
                </div>

                <div class="result-card">
                    <h3><span class="icon">📈</span> 五向熵维图</h3>
                    <div class="chart-container">
                        <canvas id="radarChart" width="400" height="400"></canvas>
                    </div>
                </div>

                <div class="result-card entropy-type-card">
                    <div class="type-icon">${data.typeIcon}</div>
                    <div class="type-name">${data.entropyType}</div>
                    <div class="type-description">${data.typeDesc}</div>
                    <div class="type-traits">
                        ${data.typeTraits.map(t => `<span class="trait-tag">${t}</span>`).join('')}
                    </div>
                </div>

                <div style="text-align: center;">
                    <button class="restart-btn" onclick="restart()">重新测评</button>
                </div>
            `;

            // 绘制雷达图
            drawRadarChart([
                data.closednessSubScore,
                data.equilibriumScore,
                data.linearityScore,
                data.disorderScore,
                data.defocusScore
            ]);

            // 滚动到顶部
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // 绘制雷达图
        function drawRadarChart(scores) {
            const canvas = document.getElementById('radarChart');
            const ctx = canvas.getContext('2d');
            const centerX = 200;
            const centerY = 200;
            const radius = 150;
            const labels = ['封闭性', '平衡态', '高线性', '内心失序', '能量失焦'];
            const numPoints = 5;
            const angleStep = (2 * Math.PI) / numPoints;
            const startAngle = -Math.PI / 2;

            // 清空画布
            ctx.clearRect(0, 0, 400, 400);

            // 绘制背景网格
            for (let level = 1; level <= 5; level++) {
                ctx.beginPath();
                for (let i = 0; i <= numPoints; i++) {
                    const angle = startAngle + i * angleStep;
                    const r = (radius / 5) * level;
                    const x = centerX + r * Math.cos(angle);
                    const y = centerY + r * Math.sin(angle);
                    if (i === 0) {
                        ctx.moveTo(x, y);
                    } else {
                        ctx.lineTo(x, y);
                    }
                }
                ctx.closePath();
                ctx.strokeStyle = '#e2e8f0';
                ctx.stroke();
            }

            // 绘制轴线
            for (let i = 0; i < numPoints; i++) {
                const angle = startAngle + i * angleStep;
                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.lineTo(centerX + radius * Math.cos(angle), centerY + radius * Math.sin(angle));
                ctx.strokeStyle = '#e2e8f0';
                ctx.stroke();
            }

            // 绘制数据区域
            ctx.beginPath();
            for (let i = 0; i <= numPoints; i++) {
                const angle = startAngle + (i % numPoints) * angleStep;
                const r = (scores[i % numPoints] / 5) * radius;
                const x = centerX + r * Math.cos(angle);
                const y = centerY + r * Math.sin(angle);
                if (i === 0) {
                    ctx.moveTo(x, y);
                } else {
                    ctx.lineTo(x, y);
                }
            }
            ctx.closePath();
            ctx.fillStyle = 'rgba(102, 126, 234, 0.3)';
            ctx.fill();
            ctx.strokeStyle = '#667eea';
            ctx.lineWidth = 2;
            ctx.stroke();

            // 绘制数据点
            for (let i = 0; i < numPoints; i++) {
                const angle = startAngle + i * angleStep;
                const r = (scores[i] / 5) * radius;
                const x = centerX + r * Math.cos(angle);
                const y = centerY + r * Math.sin(angle);
                ctx.beginPath();
                ctx.arc(x, y, 5, 0, 2 * Math.PI);
                ctx.fillStyle = '#667eea';
                ctx.fill();
            }

            // 绘制标签
            ctx.font = '14px -apple-system, sans-serif';
            ctx.fillStyle = '#4a5568';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            for (let i = 0; i < numPoints; i++) {
                const angle = startAngle + i * angleStep;
                const labelRadius = radius + 25;
                const x = centerX + labelRadius * Math.cos(angle);
                const y = centerY + labelRadius * Math.sin(angle);
                ctx.fillText(labels[i], x, y);
                
                // 显示分数
                const scoreRadius = radius + 45;
                const sx = centerX + scoreRadius * Math.cos(angle);
                const sy = centerY + scoreRadius * Math.sin(angle);
                ctx.font = 'bold 12px -apple-system, sans-serif';
                ctx.fillStyle = '#667eea';
                ctx.fillText(scores[i].toFixed(2), sx, sy);
                ctx.font = '14px -apple-system, sans-serif';
                ctx.fillStyle = '#4a5568';
            }

            // 绘制刻度
            ctx.font = '10px -apple-system, sans-serif';
            ctx.fillStyle = '#a0aec0';
            for (let level = 1; level <= 5; level++) {
                const y = centerY - (radius / 5) * level;
                ctx.fillText(level.toString(), centerX + 10, y);
            }
        }

        // 重新开始
        function restart() {
            document.getElementById('results').style.display = 'none';
            document.getElementById('questionnaire').style.display = 'block';
            
            // 清除所有选择
            document.querySelectorAll('input[type="radio"]').forEach(input => {
                input.checked = false;
            });
            
            // 清除已回答样式
            document.querySelectorAll('.question-card').forEach(card => {
                card.classList.remove('answered');
            });
            
            // 重置进度条
            document.getElementById('progressFill').style.width = '0%';
            
            // 滚动到顶部
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // 初始化
        generateQuestions();
    </script>
</body>
</html>
